  </g>

  <defs>
    <linearGradient id="siaga_gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25845F" stop-opacity="0.4" />
      <stop offset="1" stop-color="#0F3822" stop-opacity="0.8" />
    </linearGradient>
  </defs>
