<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Badge / Container -->
  <rect width="64" height="64" rx="16" fill="#176B4D" />
  
  <!-- Subtle Gradient Accent Layer -->
  <rect width="64" height="64" rx="16" fill="url(#siaga_gradient)" />
  
  <!-- Simbol Bencana Alam (Gunung / Geologi & Gelombang Air / Hidrometeorologi) -->
  <g stroke="#6EE7B7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Puncak Gunung / Bukit (Gempa, Longsor, Erupsi) -->
